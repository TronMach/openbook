<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · OpenBook</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
        :root { --bg: #f6f7f9; --surface: #ffffff; --text: #1d2430; --muted: #5b6575; --accent: #1f6f5c; --accent-text: #ffffff; color-scheme: light; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #14171c; --surface: #1c2027; --text: #e6e9ee; --muted: #9aa3b0; --accent: #4fb596; --accent-text: #0d1512; color-scheme: dark; }
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
        main { background: var(--surface); padding: 2rem; border-radius: 12px; max-width: 26rem; margin: 1rem; text-align: center; }
        img { width: 64px; height: 64px; }
        p { color: var(--muted); line-height: 1.5; }
        button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" />
        <h1>You're offline</h1>
        <p>OpenBook keeps your books on the server, so it needs a connection to show them. Check the network and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
