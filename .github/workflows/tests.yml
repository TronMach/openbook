# Builds OpenBook and runs the test suites on every push to master and every pull request: the whole suite on SQLite,
# and the integration suite on PostgreSQL (a test-only server set up by tools/pgtest.ps1 from the PostgreSQL programs
# installed on GitHub's Windows runners, with nothing waiting for the disk, reached as a login that may create
# databases but isn't a superuser, as locally). Windows, like the release workflow, whose test
# step has passed there on every release. Failed tests are listed on the run's summary page and their trx files kept.
# The server edition runs on Linux, so the SQLite suite runs there too (without the browser tests, which the Windows jobs
# run), and the Docker image is built and started on SQLite and on PostgreSQL until its health check answers.
# The SQLite job also checks every package's licence (tools/check-licences.ps1), so a Dependabot update can't bring in
# one OpenBook can't use.
# The four test jobs are required checks on master, so every pull request must report them: a pull request runs this
# workflow whatever it changes, and the jobs skip (which counts as passing) when it changes only the files below, the
# same ones pushes to master ignore. If the check of the changed files fails, the jobs run.
name: Tests

on:
  push:
    branches: [master]
    paths-ignore: ['CLAUDE.md', 'README.md', 'ROADMAP.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md', 'PRIVACY.md', 'docs/dev/**', 'docs/admin/**', 'website/**', '.github/workflows/website.yml', '.github/ISSUE_TEMPLATE/**', '.github/pull_request_template.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its run; every push to master is tested to the end.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # A pull request is checked out as its merge with the base, so HEAD^1 is the base and the diff is what it changes.
      # Keep this list in step with paths-ignore above.
      - name: Only text that needs no tests?
        id: check
        run: |
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  CLAUDE.md|README.md|ROADMAP.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|PRIVACY.md) ;;
                  docs/dev/*|docs/admin/*|website/*|.github/ISSUE_TEMPLATE/*) ;;
                  .github/workflows/website.yml|.github/pull_request_template.md) ;;
                  *) docs_only=false; echo "Needs the tests: $f"; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Only text that needs no tests: $docs_only"

  sqlite:
    name: SQLite (all tests, Release build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The release workflow packages a Release build, where the analyzers are stricter; catch that here.
      - name: Build (Release)
        run: dotnet build -c Release -nologo

      # Every package, direct or not, under a licence the AGPL can take, and PDFsharp-MigraDoc held at 6.2.4.
      - name: Package licences
        shell: pwsh
        run: ./tools/check-licences.ps1

      - name: Test
        shell: pwsh
        run: ./tools/run-tests.ps1 -Results "$env:RUNNER_TEMP/test-results"

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-test-results
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14

  linux:
    name: Linux (SQLite tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The font the image installs, for PDF forms without a shipped font.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Build
        run: dotnet build tests/OpenBook.Integration.Tests -nologo -v q && dotnet build tests/OpenBook.Domain.Tests -nologo -v q

      - name: Test (Domain)
        run: dotnet test tests/OpenBook.Domain.Tests --no-build -nologo --logger "trx;LogFilePrefix=linux" --results-directory "$RUNNER_TEMP/test-results"

      - name: Test (Integration)
        env:
          OPENBOOK_TEST_BROWSER: '0'
          OPENBOOK_TEST_TIMES: ${{ github.workspace }}/tools/test-times.json
        run: dotnet test tests/OpenBook.Integration.Tests --no-build -nologo --logger "trx;LogFilePrefix=linux" --logger "console;verbosity=minimal" --results-directory "$RUNNER_TEMP/test-results" -- xUnit.MaxParallelThreads=3

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-results
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14

  container:
    name: Docker image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t openbook:test .

      - name: Start on SQLite
        run: |
          docker run -d --name sqlite -p 8081:8080 openbook:test
          sh tools/wait-for-health.sh sqlite http://localhost:8081

      - name: Start on PostgreSQL
        run: |
          password=$(openssl rand -hex 16)
          docker network create openbook
          docker run -d --name db --network openbook -e POSTGRES_DB=openbook -e POSTGRES_USER=openbook -e POSTGRES_PASSWORD="$password" postgres:17
          docker run -d --name postgres --network openbook -p 8082:8080 -e ConnectionStrings__OpenBook="Host=db;Database=openbook;Username=openbook;Password=$password" --restart on-failure openbook:test
          sh tools/wait-for-health.sh postgres http://localhost:8082

  postgres:
    name: PostgreSQL (integration tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The runner image installs PostgreSQL (stopped, PGBIN set). Its programs set up a test-only server on port 5433
      # in artifacts/pgtest, which run-tests.ps1 would also start; started here so its own step shows the version.
      - name: Start the test PostgreSQL server
        shell: pwsh
        run: |
          & (Join-Path $env:PGBIN 'postgres.exe') --version
          ./tools/pgtest.ps1 start

      - name: Test
        shell: pwsh
        run: ./tools/run-tests.ps1 -Postgres -Results "$env:RUNNER_TEMP/test-results"

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-results
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14
